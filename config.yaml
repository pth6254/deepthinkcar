# 라즈베리파이 4 차선 인식 자율주행 RC카 설정
#
# 부호 규칙 (모든 모듈 공통)
#   steer    : -1.0(왼쪽 끝) ~ +1.0(오른쪽 끝)   → ±max_steer_deg
#   throttle : -1.0(후진)    ~ +1.0(전진)
#   오차 e   : -1.0 ~ +1.0, e > 0 이면 차선 중심이 화면 오른쪽(→ 오른쪽으로 조향)

loop_hz: 20

camera:
  width: 320
  height: 240
  fps: 30
  hflip: false
  vflip: false

lane:
  # 테이프 색 HSV 범위 (OpenCV: H 0~179). 빨강처럼 H가 0을 넘나들면 lower H > upper H 로 적는다.
  hsv_lower: [170, 80, 60]    # 빨간 테이프: H 가 0 을 넘나들어 lower H > upper H
  hsv_upper: [10, 255, 255]
  blur_ksize: 5
  canny_low: 50
  canny_high: 150
  # ROI 다각형 꼭짓점 (x, y 를 화면 비율 0~1 로). 기본값: 화면 아래 58%
  roi: [[0.0, 1.0], [0.0, 0.42], [1.0, 0.42], [1.0, 1.0]]
  hough_threshold: 15
  hough_min_line_length: 12
  hough_max_line_gap: 8
  min_angle_deg: 20        # 수평에 가까운 선분(이 각도 미만)은 버린다
  min_total_length: 25     # 한쪽 차선으로 인정할 선분 길이 합(px)
  sharp_turn: true         # 급커브 미리 판단: 누운 테이프가 앞을 가로막으면 그 방향으로 꺾음 (false: 끔)
  sharp_hold_frames: 15    # 급커브 보조: 차선을 놓쳐도 가로 테이프가 보이면 직전 방향 유지 (최대 장수, 0: 끔)
  lookahead: 0.62          # 오차를 재는 행 (화면 높이 비율)
  lane_width_px: 190       # lookahead 행에서의 차선 폭 초기값. 양쪽이 보이면 자동 보정됨

control:
  kp: 60.0                 # deg / e
  ki: 0.0                  # deg / (e·s)
  kd: 4.0                  # deg / (e/s)
  max_steer_deg: 60.0      # 최대 조향 (급커브·U턴, 수동). servo_left/right_deg 와 함께 바꾼다
  normal_steer_deg: 45.0   # 평소 자율주행의 조향 제한
  max_steer_rate_deg_s: 240.0   # 조향 변화율 제한
  throttle_max: 0.20       # 직선 속도 (듀티 37%)
  throttle_min: 0.10       # 커브 속도 (듀티 31%)
  curve_slowdown: 4.0      # 커브 감속 강도. 2 면 절반만 꺾어도 커브 속도까지 줄임 (0: 감속 없음)
  single_lane_boost: true  # 한쪽 차선만 보이며 오차 0.6 이상이면 45° 제한을 풀고 오차만큼 꺾음 (false: 끔)
  difficulty_speed: true   # 차선 유지 난이도에 따라 감속, 쉬워지면 복귀 (false: 끔)
  extreme_error: 0.9       # 오차가 이 이상 3장 연속이면 최대 조향 + 끊어 전진 (0: 끔)
  sharp_brake_frames: 4    # 급커브 진입 때 멈칫하는 장수 (20장 = 1초)
  sharp_on_frames: 2       # 급커브에서 전진하는 장수
  sharp_off_frames: 1      # 급커브에서 쉬는 장수 (클수록 느림)
  throttle_accel: 0.2      # 커브를 나온 뒤 초당 스로틀 증가량
  lane_lost_timeout_s: 0.5 # 차선 미검출이 이 시간 이상이면 정지

manual:
  throttle_scale: 0.25     # 스틱을 끝까지 밀었을 때의 throttle

actuator:
  i2c_address: 0x40
  pwm_freq: 50
  servo_channel: 0
  esc_channel: 1           # drive_motor: esc 일 때만 사용
  drive_motor: l9110       # l9110 (키트: GPIO 로 DC 모터 2개) | esc (PCA9685 ch1)
  # 아래 펄스폭(us)은 calibrate.py 로 측정해 채운다
  # 조향 서보 각도 (0~180°). 90° = 바퀴가 정면(직진)
  servo_center_deg: 90     # 직진. 바퀴가 살짝 틀어져 있으면 89, 91 처럼 미세 조정
  servo_left_deg: 30       # steer = -1 (왼쪽 끝). 반대로 꺾이면 left/right 값을 서로 바꾼다
  servo_right_deg: 150     # steer = +1 (오른쪽 끝)
  servo_us_at_0deg: 750    # 서보 0° 펄스폭 (키트 코드의 ServoKit 기본값: 0°=750us, 180°=2250us)
  servo_us_at_180deg: 2250
  esc_neutral_us: 1500
  esc_fwd_min_us: 1550     # 바퀴가 돌기 시작하는 펄스
  esc_fwd_max_us: 1700     # throttle = +1 (속도 상한)
  esc_rev_min_us: 1450
  esc_rev_max_us: 1350     # throttle = -1
  arm_seconds: 2.0         # 시작 시 ESC 아밍용 중립 유지 시간
  watchdog_s: 0.5          # 이 시간 동안 명령이 없으면 자동으로 중립

motor:                     # 뒷바퀴 DC 기어드 모터 ×2, L9110 드라이버 (BCM 핀 번호)
  pwm_hz: 100
  right_pwm_pin: 19
  right_dir_pin: 13
  left_pwm_pin: 12
  left_dir_pin: 16
  right_reverse: false     # 이 바퀴만 뒤로 돌면 true
  left_reverse: false
  duty_min: 0.25           # throttle 이 0 에 가까울 때 듀티
  duty_max: 0.85           # throttle = ±1 일 때 듀티 (실제 = min + throttle*(max-min))

input:
  device: web              # web(브라우저 대시보드) | keyboard(SSH 터미널) | gamepad
  timeout_s: 1.0           # 조작 장치 연결 끊김이 이 시간 이상이면 정지

web:
  enabled: true            # 다른 조작 장치를 쓸 때도 영상·비상정지·튜닝용으로 대시보드를 켠다
  host: 0.0.0.0
  port: 8080
  token: ""                # 비우면 토큰 없이 접속. 값을 넣으면 주소 뒤에 ?token=값 필요
  stream_fps: 10
  jpeg_quality: 70
  reply_timeout_s: 0.5     # 조종 화면의 신호가 이보다 늦으면 '끊김' 상태 (수동 입력 즉시 0)

keyboard:
  steer_step: 0.25         # a/d 한 번에 바뀌는 조향 (-1~1 기준)
  throttle_step: 0.2       # w/s 한 번에 바뀌는 스로틀 (manual.throttle_scale 이 곱해짐)
  ping_interval_s: 0.2     # 연결 확인 질의 주기
  reply_timeout_s: 0.5     # 응답이 이보다 늦으면 '끊김' 상태 (수동 입력 즉시 0)

joystick:                  # 게임패드 (input.device: gamepad 일 때)
  index: 0
  axis_steer: 0            # 왼쪽 스틱 좌우
  axis_throttle: 1         # 왼쪽 스틱 상하
  invert_steer: false
  invert_throttle: true    # 대부분의 패드는 위로 밀면 음수
  deadzone: 0.08
  button_mode: 0           # manual → opencv → cnn 순환
  button_estop: 1          # 비상정지 (다시 누르면 해제, 스로틀 중립일 때만)
  button_record: 2         # manual 모드에서 녹화 시작/종료

recorder:
  dir: data                # 수집 데이터 폴더 (프로젝트 폴더 기준). 녹화마다 data/<날짜_시간>/ 생성
  hz: 20
  jpeg_quality: 90
  auto: true               # 움직이면 모든 모드에서 자동 녹화 (false: 녹화 버튼으로만)
  auto_stop_s: 2.0         # 이 시간 이상 멈추면 자동 녹화 종료
  min_free_mb: 1000        # 저장 공간이 이보다 적으면 녹화하지 않음

cnn:
  model: models/lane_20261125_141849.tflite   # ±45° 재학습 모델. 이전: models/lane_20261125_113821.tflite / 키트: models/lane_kit.tflite
  assist_error: 0.8        # 급커브 보정: 차선 오차가 이 이상인데 AI 가 덜 꺾으면 OpenCV 만큼 꺾음 (0: 끔)
  throttle_max: 0.3        # 추론 스로틀 상한
  num_threads: 2
