<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>deepthinkcar</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --line: #2a2f3a; --text: #e7e9ee; --dim: #8a90a0;
    --ok: #2fbf71; --warn: #f0b429; --bad: #e5484d; --accent: #4c8dff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .hidden { display: none !important; }

  header { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 5; }
  .pill { padding: 2px 10px; border-radius: 999px; font-weight: 600; background: #2a2f3a; }
  .pill.ok { background: var(--ok); color: #04170d; }
  .pill.bad { background: var(--bad); color: #fff; }
  .pill.warn { background: var(--warn); color: #1d1500; }
  .pill.accent { background: var(--accent); color: #fff; }
  .stat { color: var(--dim); font-variant-numeric: tabular-nums; }
  .stat b { color: var(--text); font-weight: 600; display: inline-block; min-width: 3.2em; }

  #banner { padding: 8px 12px; background: #3a1f12; color: #ffd2b8; border-bottom: 1px solid #5a2e1a; }
  #banner.bad { background: #4a1416; color: #ffd6d7; border-color: #6d1d20; }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; padding: 12px;
    max-width: 1280px; margin: 0 auto; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .card h3 { margin: 0 0 8px; font-size: 13px; color: var(--dim); font-weight: 600; }

  #video-wrap { position: relative; background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 4 / 3; }
  #video { width: 100%; height: 100%; object-fit: contain; display: block; image-rendering: auto; }
  #video-msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); }

  .seg { display: flex; gap: 0; margin-top: 10px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { flex: 1; padding: 9px 4px; background: transparent; border: 0; border-right: 1px solid var(--line); }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--accent); color: #fff; font-weight: 600; }
  .seg button:disabled { color: #4b5160; cursor: not-allowed; }

  #side { display: flex; flex-direction: column; gap: 12px; }
  #estop { width: 100%; padding: 18px; border: 0; border-radius: 10px; background: var(--bad); color: #fff;
    font-size: 22px; font-weight: 800; letter-spacing: .04em; box-shadow: 0 2px 0 #8e2326; }
  #estop:active { transform: translateY(1px); }
  #estop.latched { background: var(--warn); color: #1d1500; box-shadow: 0 2px 0 #9c7310; }
  #estop small, #recbtn small { font-weight: 500; opacity: .75; font-size: 12px; margin-left: 6px; }
  #recbtn { width: 100%; margin-top: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; }
  #recbtn.on { background: #3b1214; border-color: var(--bad); color: #ffb4b6; }

  #owner-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; min-height: 30px; }
  #owner-msg { color: var(--dim); }
  #take { padding: 5px 10px; border-radius: 6px; border: 1px solid var(--accent); background: transparent; color: var(--accent); }
  #pad { position: relative; width: 220px; height: 220px; margin: 0 auto; border-radius: 50%;
    background: radial-gradient(circle, #20242d 0 60%, #1a1d24 61%); border: 1px solid var(--line);
    touch-action: none; user-select: none; -webkit-user-select: none; }
  #pad::before, #pad::after { content: ""; position: absolute; background: var(--line); }
  #pad::before { left: 50%; top: 10%; bottom: 10%; width: 1px; }
  #pad::after { top: 50%; left: 10%; right: 10%; height: 1px; }
  #knob { position: absolute; width: 64px; height: 64px; left: 50%; top: 50%; margin: -32px 0 0 -32px;
    border-radius: 50%; background: var(--accent); box-shadow: 0 2px 8px #0008; pointer-events: none; z-index: 1; }
  #pad.off { opacity: .35; pointer-events: none; }
  .hint { color: var(--dim); font-size: 12px; margin: 10px 0 0; }
  kbd { background: #262a33; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; font-size: 11px; }

  details summary { cursor: pointer; color: var(--text); font-weight: 600; }
  .group { margin-top: 12px; }
  .group h4 { margin: 0 0 6px; font-size: 12px; color: var(--dim); font-weight: 600; }
  .row { display: grid; grid-template-columns: 1fr 56px; gap: 2px 8px; align-items: center; margin: 4px 0; }
  .row label { font-size: 12px; color: var(--dim); grid-column: 1 / -1; }
  .row input[type=range] { width: 100%; accent-color: var(--accent); }
  .row output { text-align: right; font-variant-numeric: tabular-nums; }
  #save { margin-top: 12px; width: 100%; padding: 9px; border-radius: 8px; border: 1px solid var(--line); background: #222632; }
  #save-msg { display: block; margin-top: 6px; font-size: 12px; color: var(--dim); min-height: 1em; }
</style>
</head>
<body>
<header>
  <span id="conn" class="pill">연결 중…</span>
  <span id="mode" class="pill">—</span>
  <span id="rec" class="pill bad hidden">● REC</span>
  <span class="stat">FPS <b id="fps">—</b></span>
  <span class="stat">처리 <b id="proc">—</b></span>
  <span class="stat">오차 e <b id="err">—</b></span>
  <span class="stat">난이도 <b id="diff">—</b></span>
  <span class="stat">조향 <b id="st">—</b></span>
  <span class="stat">스로틀 <b id="th">—</b></span>
</header>
<div id="banner" class="hidden"></div>

<main>
  <section>
    <div class="card">
      <div id="video-wrap"><img id="video" alt=""><div id="video-msg">영상 대기 중…</div></div>
      <div class="seg" id="views">
        <button data-view="overlay" class="on">차선 오버레이</button>
        <button data-view="mask">HSV 마스크</button>
        <button data-view="edges">에지</button>
        <button data-view="raw">원본</button>
      </div>
    </div>
  </section>

  <section id="side">
    <div class="card">
      <button id="estop">비상정지<small>Space</small></button>
      <div class="seg" id="modes">
        <button data-mode="manual">수동</button>
        <button data-mode="opencv">OpenCV</button>
        <button data-mode="cnn">AI 주행</button>
      </div>
      <button id="recbtn">녹화 시작<small>R</small></button>
    </div>

    <div class="card" id="drive">
      <div id="owner-row"><span id="owner-msg">—</span><button id="take" class="hidden">조종권 가져오기</button></div>
      <div id="pad"><div id="knob"></div></div>
      <p class="hint" id="drive-hint">
        <kbd>W</kbd><kbd>S</kbd> 전진·후진 · <kbd>A</kbd><kbd>D</kbd> 조향 (누르고 있는 동안) ·
        <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 모드 · <kbd>Space</kbd> 비상정지
      </p>
    </div>

    <div class="card">
      <details id="tune">
        <summary>튜닝 (즉시 반영)</summary>
        <div id="tune-groups"></div>
        <button id="save">config.yaml 에 저장</button>
        <span id="save-msg"></span>
      </details>
    </div>
  </section>
</main>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const token = new URLSearchParams(location.search).get("token") || "";
const sid = Math.random().toString(36).slice(2) + Date.now().toString(36);
const api = (path) => `${path}?token=${encodeURIComponent(token)}`;
const MODE_NAMES = { manual: "수동", opencv: "OpenCV", cnn: "AI 주행" };

async function post(path, body, timeoutMs = 1500) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeoutMs);
  try {
    const r = await fetch(api(path), { method: "POST", body: JSON.stringify(body),
      headers: { "Content-Type": "application/json" }, signal: ctl.signal });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(data.error || r.status), { status: r.status });
    return data;
  } finally { clearTimeout(timer); }
}
const action = (name, value) => post("/api/action", { sid, action: name, value }).catch(() => {});

/* ---------------- 영상 ---------------- */
let view = "overlay";
const video = $("#video");
function startVideo() {
  video.src = document.hidden ? "" : api("/stream.mjpg") + `&view=${view}&_=${Date.now()}`;
}
video.onload = () => $("#video-msg").classList.add("hidden");
video.onerror = () => {
  if (document.hidden) return;
  $("#video-msg").classList.remove("hidden");
  setTimeout(startVideo, 1000);
};
$("#views").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  view = b.dataset.view;
  document.querySelectorAll("#views button").forEach((x) => x.classList.toggle("on", x === b));
  startVideo();
});

/* ---------------- 조종 입력 ---------------- */
const pad = $("#pad"), knob = $("#knob");
let padId = null, padX = 0, padY = 0;
function drawKnob() {
  const r = pad.clientWidth / 2 - 32;
  knob.style.transform = `translate(${padX * r}px, ${-padY * r}px)`;
}
function movePad(e) {
  const b = pad.getBoundingClientRect();
  let x = ((e.clientX - b.left) / b.width) * 2 - 1, y = -(((e.clientY - b.top) / b.height) * 2 - 1);
  const m = Math.hypot(x, y); if (m > 1) { x /= m; y /= m; }
  padX = x; padY = y; drawKnob();
}
function releasePad() { padId = null; padX = padY = 0; drawKnob(); }
pad.addEventListener("pointerdown", (e) => { pad.setPointerCapture(e.pointerId); padId = e.pointerId; movePad(e); });
pad.addEventListener("pointermove", (e) => { if (e.pointerId === padId) movePad(e); });
for (const ev of ["pointerup", "pointercancel", "lostpointercapture"])
  pad.addEventListener(ev, (e) => { if (e.pointerId === padId) releasePad(); });

const keys = new Set();
const DRIVE_KEYS = { KeyW: "up", ArrowUp: "up", KeyS: "down", ArrowDown: "down",
                     KeyA: "left", ArrowLeft: "left", KeyD: "right", ArrowRight: "right" };
addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === "Space") { e.preventDefault(); if (!e.repeat) action("estop"); return; }
  if (DRIVE_KEYS[e.code]) { e.preventDefault(); keys.add(DRIVE_KEYS[e.code]); return; }
  if (e.repeat) return;
  const mode = { Digit1: "manual", Digit2: "opencv", Digit3: "cnn" }[e.code];
  if (mode) action("mode", mode);
  if (e.code === "KeyR") action("record");
});
addEventListener("keyup", (e) => { if (DRIVE_KEYS[e.code]) keys.delete(DRIVE_KEYS[e.code]); });
function releaseAll() { keys.clear(); releasePad(); }
addEventListener("blur", releaseAll);
document.addEventListener("visibilitychange", () => { releaseAll(); startVideo(); });

let kSteer = 0, lastTick = performance.now();
function command() {
  const now = performance.now(), dt = Math.min(0.2, (now - lastTick) / 1000); lastTick = now;
  const target = (keys.has("right") ? 1 : 0) - (keys.has("left") ? 1 : 0);
  const rate = target === 0 ? 6 : 3;                        // 놓으면 빠르게 중앙으로
  kSteer += Math.max(-rate * dt, Math.min(rate * dt, target - kSteer));
  if (padId !== null) return { steer: padX, throttle: padY };
  return { steer: kSteer, throttle: (keys.has("up") ? 1 : 0) - (keys.has("down") ? 1 : 0) };
}

/* ---------------- 상태 표시 ---------------- */
let lastOk = 0, inFlight = false, authFailed = false;
const fmt = (v, d = 2) => (v === null || v === undefined ? "—" : (v >= 0 ? "+" : "") + v.toFixed(d));
function setPill(el, text, cls) { el.textContent = text; el.className = "pill " + (cls || ""); }

function render(s) {
  setPill($("#conn"), "연결됨", "ok");
  setPill($("#mode"), s.estop ? "비상정지" : (MODE_NAMES[s.mode] || s.mode), s.estop ? "bad" : s.mode === "manual" ? "" : "accent");
  $("#rec").classList.toggle("hidden", !s.rec);
  $("#rec").textContent = `● REC ${s.rec_count}`;
  $("#fps").textContent = s.fps?.toFixed(1) ?? "—";
  $("#fps").style.color = s.fps && s.fps < 15 ? "var(--bad)" : "";
  $("#proc").textContent = s.proc_ms !== undefined ? s.proc_ms.toFixed(1) + "ms" : "—";
  $("#err").textContent = s.mode === "opencv" ? (s.error === null ? "미검출" : fmt(s.error, 3)) : "—";
  $("#diff").textContent = s.mode === "manual" ? "—" : s.difficulty.toFixed(2) + (s.difficulty >= 0.4 ? ` (${s.difficulty_reason})` : "");
  $("#diff").style.color = s.difficulty >= 0.7 ? "var(--bad)" : s.difficulty >= 0.4 ? "var(--warn)" : "";
  $("#st").textContent = fmt(s.steer); $("#th").textContent = fmt(s.throttle);

  const es = $("#estop");
  es.classList.toggle("latched", !!s.estop);
  es.firstChild.textContent = s.estop ? "비상정지 해제" : "비상정지";
  document.querySelectorAll("#modes button").forEach((b) => {
    b.classList.toggle("on", !s.estop && b.dataset.mode === s.mode);
    b.disabled = !!s.estop || (b.dataset.mode === "cnn" && !s.cnn);
    b.title = b.dataset.mode === "cnn" && !s.cnn ? "AI 모델 파일 없음" : "";
  });
  const rb = $("#recbtn");
  rb.classList.toggle("on", !!s.rec);
  rb.firstChild.textContent = s.rec ? `녹화 중지 (${s.rec_count}장)` : "녹화 시작";

  const msg = $("#owner-msg"), take = $("#take");
  pad.classList.toggle("off", !s.drive_enabled || !s.owner);
  $("#drive-hint").classList.toggle("hidden", !s.drive_enabled);
  if (!s.drive_enabled) { msg.textContent = "조종은 다른 장치(키보드/게임패드)로 합니다"; take.classList.add("hidden"); }
  else if (!s.owner) { msg.textContent = "다른 화면이 조종 중"; take.classList.remove("hidden"); }
  else if (s.latched) { msg.textContent = "스로틀을 중립으로 놓으면 조종 시작"; take.classList.add("hidden"); }
  else { msg.textContent = "이 화면에서 조종 중"; take.classList.add("hidden"); }

  const banner = $("#banner");
  if (s.estop) { banner.textContent = "비상정지 상태 — 스로틀을 중립에 두고 [비상정지 해제]를 누르세요"; banner.className = "bad"; }
  else if (s.stop_reason && s.stop_age !== null && s.stop_age < 8) {
    banner.textContent = `안전 정지: ${s.stop_reason} (${s.stop_age.toFixed(0)}초 전) — 수동 모드로 돌아왔습니다`; banner.className = "";
  } else banner.className = "hidden";
}

function showDisconnected(text) {
  setPill($("#conn"), text, "bad");
  const banner = $("#banner");
  banner.textContent = authFailed ? "토큰이 맞지 않습니다 — 차량 로그에 찍힌 주소(…/?token=…)로 접속하세요"
                                  : "차량과 연결이 끊겼습니다 — 1초 이상 끊기면 차량은 스스로 정지합니다";
  banner.className = "bad";
}

async function tick() {
  if (document.hidden || inFlight || authFailed) return;
  inFlight = true;
  try {
    const s = await post("/api/control", { sid, ...command() }, 500);
    lastOk = Date.now(); render(s);
  } catch (e) {
    if (e.status === 403) { authFailed = true; showDisconnected("토큰 오류"); }
    else if (Date.now() - lastOk > 600) showDisconnected("연결 끊김");
  } finally { inFlight = false; }
}
setInterval(tick, 100);

/* ---------------- 버튼 ---------------- */
$("#estop").addEventListener("click", () => action("estop"));
$("#recbtn").addEventListener("click", () => action("record"));
$("#take").addEventListener("click", () => action("take"));
$("#modes").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (b && !b.disabled) action("mode", b.dataset.mode);
});

/* ---------------- 튜닝 ---------------- */
function decimals(step) { const s = String(step); return s.includes(".") ? s.split(".")[1].length : 0; }
async function loadTuning() {
  let info;
  try {
    const r = await fetch(api("/api/config")); if (!r.ok) throw r;
    info = await r.json();
  } catch { setTimeout(loadTuning, 2000); return; }
  const root = $("#tune-groups"); root.textContent = "";
  const groups = {};
  for (const t of info.tunables) {
    if (!groups[t.group]) {
      const g = document.createElement("div"); g.className = "group";
      g.innerHTML = `<h4></h4>`; g.firstChild.textContent = t.group;
      root.appendChild(g); groups[t.group] = g;
    }
    const row = document.createElement("div"); row.className = "row";
    const id = "t_" + t.key.replace(/\W/g, "_");
    row.innerHTML = `<label for="${id}"></label><input type="range" id="${id}"><output></output>`;
    row.querySelector("label").textContent = t.label;
    const input = row.querySelector("input"), out = row.querySelector("output");
    Object.assign(input, { min: t.min, max: t.max, step: t.step, value: t.value });
    const d = decimals(t.step);
    out.textContent = Number(t.value).toFixed(d);
    let timer = null;
    input.addEventListener("input", () => {
      out.textContent = Number(input.value).toFixed(d);
      clearTimeout(timer);
      timer = setTimeout(async () => {
        try {
          const r = await post("/api/tune", { key: t.key, value: Number(input.value) });
          input.value = r.value; out.textContent = Number(r.value).toFixed(d);
          $("#save-msg").textContent = "저장되지 않은 변경 있음";
        } catch (e) { $("#save-msg").textContent = "반영 실패: " + e.message; }
      }, 60);
    });
    groups[t.group].appendChild(row);
  }
}
$("#save").addEventListener("click", async () => {
  try {
    const r = await post("/api/save", {});
    $("#save-msg").textContent = `저장됨: ${r.path} (${r.saved.length}개 항목)`;
  } catch (e) { $("#save-msg").textContent = "저장 실패: " + e.message; }
});

drawKnob();
loadTuning();
// 끝나지 않는 MJPEG 이 페이지 load 를 막지 않도록 load 이후에 영상을 연다
if (document.readyState === "complete") startVideo(); else addEventListener("load", startVideo);
</script>
</body>
</html>
